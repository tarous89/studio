<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio — Stories that stick</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{font-family:DM Sans,sans-serif;color:#323346}*{box-sizing:border-box}body{margin:0;background:#f9f8fc;min-height:100vh;background-image:radial-gradient(ellipse at 88% 0%,#fce1e7,transparent 40%),radial-gradient(ellipse at 0% 95%,#dcece9,transparent 40%)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:hover{filter:brightness(.97)}.glass{background:#ffffffac;backdrop-filter:blur(25px);border:1px solid #ffffffd9;box-shadow:0 8px 35px #46406d0c}.shell{display:flex;min-height:100vh;gap:34px;padding:16px}.side{width:230px;flex-shrink:0;position:sticky;top:16px;height:calc(100vh - 32px);border-radius:25px;padding:29px 15px;display:flex;flex-direction:column}.brand{font:800 29px Manrope;letter-spacing:-2px;padding:8px 14px 40px}.mark{display:inline-grid;place-items:center;background:linear-gradient(130deg,#bdaced,#927fd9);color:white;width:34px;height:34px;border-radius:12px;margin-right:10px;font:700 20px Manrope}.brand b{color:#aa8cde}.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:15px 19px;border-radius:13px;color:#93909f;font-size:13px;font-weight:700;margin:4px 0}.menu button.active{background:#383345;color:white}.aside-note{margin-top:auto;background:linear-gradient(145deg,#e7def9,#f8e2e8);padding:20px;border-radius:20px}.aside-note b{font-size:14px}.aside-note p{font-size:11px;color:#90869e;line-height:1.8}.aside-note button{border:0;border-radius:9px;background:white;padding:11px;font-size:11px;font-weight:700}.main{flex:1;max-width:1560px;padding:30px 42px 70px 0;min-width:0}h1,h2,h3,h4{font-family:Manrope;margin:0;letter-spacing:-.8px}h1{font-size:34px}h2{font-size:31px}h3{font-size:22px}p{line-height:1.6}.eyebrow{letter-spacing:2px;font-size:10px;font-weight:800;color:#aaa0c0}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.primary{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:13px;color:white;background:linear-gradient(120deg,#b09bef,#927ad6);padding:13px 22px;font-size:12px;font-weight:800;box-shadow:0 8px 24px #a38bdd66}.secondary{border:1px solid #eeeaf3;background:white;color:#636073;padding:12px 18px;border-radius:12px;font-weight:800;font-size:12px}.hero{display:flex;background:linear-gradient(110deg,#e9e4fa,#f8ecfd 52%,#fbe3e3);border-radius:28px;padding:46px;min-height:330px;overflow:hidden;position:relative}.hero .copy{max-width:560px;z-index:2}.hero h2{font-size:45px;line-height:1.22;margin:15px 0}.hero h2 em{color:#a18ad9;font-style:normal}.hero p{color:#89859b;font-size:13px;max-width:385px}.hero .primary{margin-top:15px;background:#363143}.art{position:absolute;width:210px;height:280px;right:165px;top:26px;background:linear-gradient(135deg,#a697e5,#7b6bc5);border-radius:23px;transform:rotate(12deg);box-shadow:-50px 32px 0 -7px #edb3ad,0 20px 50px #73609e66;padding:25px;color:white}.art b{font-size:32px;line-height:1.1;position:absolute;bottom:50px;left:22px}.art small{letter-spacing:2px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:25px 0 35px}.metric{border-radius:21px;padding:23px}.metric span{font-size:11px;color:#9391a4;font-weight:700}.metric strong{font:800 32px Manrope;display:block;margin:12px 0 0}.metric small{font-size:10px;color:#b3b1bd}.section{display:flex;justify-content:space-between;align-items:center;margin:38px 0 18px}.section p{font-size:12px;color:#9290a3}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.card{border:0;border-radius:20px;text-align:left;padding:7px;color:inherit;min-width:0}.cover{height:190px;border-radius:15px;position:relative;padding:17px;background:linear-gradient(145deg,#f3c8b3,#e3a8b6);overflow:hidden}.cover.duotone{background:linear-gradient(140deg,#a7a0dc,#736cc1);color:white}.cover:after{content:'';position:absolute;width:200px;height:200px;right:-70px;bottom:-75px;background:#ffffff60;border-radius:50%}.cover small{letter-spacing:2px;font-size:9px;font-weight:800}.cover h4{position:absolute;bottom:36px;left:17px;right:17px;font-size:17px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;z-index:1}.card-info{padding:15px 8px}.card-info b{display:block;font-size:12px}.card-info p{font-size:10px;color:#aaa8b6}.tag{display:inline-block;background:#eee9fa;color:#8e7abd;padding:6px 10px;font-size:10px;border-radius:8px;font-weight:800}.campaigns{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.campaign{padding:23px;border-radius:20px;text-align:left;color:inherit;min-height:190px;border:0}.campaign .badge{display:inline-block;width:43px;height:43px;border-radius:14px;background:#ebe2ff;color:#9d83d3;padding:13px;margin-bottom:20px}.campaign b{display:block;font:800 18px Manrope}.campaign p{font-size:11px;color:#aaa7b5}.list{background:#fff9;border-radius:20px;padding:20px}.list-row{border-bottom:1px solid #eeecf2;padding:15px;display:flex;justify-content:space-between;align-items:center}.list-row:last-child{border:0}.list-row b{font-size:13px}.list-row p{font-size:11px;color:#aaa5b3}.login{width:min(430px,95%);border-radius:26px;padding:45px;margin:10vh auto}.login h1{font-size:40px;margin:15px 0}.login h1 span{color:#a18cd5}.login p{font-size:13px;color:#aaa3b4}.login label,.form label{font-size:12px;font-weight:800;display:block;margin:12px 0}.login input,.form input,.form textarea,.form select{background:#fcfbfe;border:1px solid #e8e5ee;border-radius:11px;padding:13px;width:100%;margin-top:7px;outline-color:#aa98dc;color:#323346}.form textarea{min-height:90px;resize:vertical}.login .primary,.form .primary{width:100%;justify-content:center;margin-top:15px}.link{border:0;background:none;color:#957cc3;margin-top:15px;font-size:12px;font-weight:800}.modal-wrap{position:fixed;inset:0;background:#2e2b4166;backdrop-filter:blur(10px);display:grid;place-items:center;padding:15px;z-index:3}.modal{background:#fffefa;border-radius:26px;padding:30px;width:min(550px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;margin-bottom:20px}.modal-head button{border:0;border-radius:9px;background:#f2f0f6;padding:8px 13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.error{color:#b66368;font-size:12px}.empty{border:1px dashed #d7d0e4;border-radius:18px;padding:36px;text-align:center;color:#9995a6;grid-column:1/-1}.hidden{display:none}.setting{display:flex;gap:16px;align-items:center;padding:23px;border-radius:18px;margin-bottom:14px}.setting b{font-size:16px}.setting p{font-size:12px;color:#aba6b3}.setting button{margin-left:auto}@media(max-width:1080px){.cards{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.art{right:20px;opacity:.5}}@media(max-width:700px){.shell{display:block;padding:8px}.side{position:static;width:100%;height:auto;padding:12px}.brand{padding:3px 8px 15px}.menu{display:flex;overflow:auto}.menu button{white-space:nowrap}.aside-note{display:none}.main{padding:25px 12px}.hero{padding:24px}.hero h2{font-size:30px}.art{opacity:.15}.campaigns{grid-template-columns:1fr}.cards{gap:9px}.cover{height:145px}.cover h4{font-size:13px}.row{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script>
let token=localStorage.getItem('studioToken')||'',me=null,campaigns=[],videos=[],stats={},studioConfig={},tab='Overview',modal='',editing=null,error='',signup=false;
const $=s=>document.querySelector(s),api=async(path,method='GET',body)=>{let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){if(!token)return;try{[me,campaigns,videos,stats,studioConfig]=await Promise.all([api('/me'),api('/campaigns'),api('/videos'),api('/stats'),api('/studio/config')]);render()}catch(e){if(/sign in|401/i.test(e.message)){token='';localStorage.removeItem('studioToken')}error=e.message;render()}}
function nav(t){tab=t;render()}function openModal(m,id){modal=m;editing=id||null;error='';render()}function closeModal(){modal='';error='';render()}
function cards(items){return '<div class="cards">'+(items.map((v,i)=>'<button class="card glass" onclick="openModal(\'detail\',\''+v.id+'\')"><div class="cover '+esc(v.style)+'"><small>STUDIO / '+String(i+1).padStart(2,'0')+'</small><h4>'+esc(v.title)+'</h4></div><div class="card-info"><b>'+esc(v.title)+'</b><p>'+esc(v.style)+' · '+new Date(v.created).toLocaleDateString()+'</p><span class="tag">'+esc(v.status)+'</span></div></button>').join('')||'<div class="empty">Your creative library is waiting. Start with a new video.</div>')+'</div>'}
function campCards(){return '<div class="campaigns">'+(campaigns.map(c=>'<button class="campaign glass" onclick="openModal(\'campaign\',\''+c.id+'\')"><span class="badge">✦</span><b>'+esc(c.name)+'</b><p>'+esc(c.topic||'A fresh content series')+'</p><span class="tag">'+esc(c.frequency)+'</span><span class="tag" style="margin-left:8px">'+(c.mode==='auto'?'Auto publish':'Review first')+'</span></button>').join('')||'<div class="empty">No campaigns yet. Create your first series.</div>')+'</div>'}
function section(title,sub='',action=''){return '<div class="section"><div><div class="eyebrow">YOUR WORKSPACE</div><h3>'+title+'</h3><p>'+sub+'</p></div>'+action+'</div>'}
function content(){if(tab==='Overview')return '<div class="hero"><div class="copy"><span class="eyebrow">✦ YOUR NEXT BIG IDEA</span><h2>Stories that stick.<br><em>Videos that move.</em></h2><p>Tell ChatGPT your topic, audience and creative direction. ChatGPT writes the scenes, Studio renders the MP4, and YouTube publishing stays under your control.</p><button class="primary" onclick="openStudioChat()">✦ Create with ChatGPT</button></div><div class="art"><small>FRAME / 001</small><b>a little<br>more magic.</b></div></div><div class="metrics">'+[['Total videos',stats.total],['Scheduled',stats.scheduled],['Published',stats.published],['Campaigns',stats.campaigns]].map(x=>'<div class="metric glass"><span>'+x[0]+'</span><strong>'+(x[1]||0)+'</strong><small>Your creative momentum</small></div>').join('')+'</div>'+section('Recent creations','Your latest work, all in one place.','<button class="secondary" onclick="nav(\'Videos\')">View all →</button>')+cards(videos.slice(0,4))+section('Campaigns in motion','Keep your stories moving.','<button class="secondary" onclick="nav(\'Campaigns\')">View all →</button>')+campCards();
if(tab==='Campaigns')return section('Campaigns','Topics and audiences that ChatGPT uses to plan and render your videos.','<button class="primary" onclick="openModal(\'campaign\')">＋ New campaign</button>')+campCards();
if(tab==='Videos')return section('All videos','Drafts render automatically into portrait MP4s. Open a Ready video to preview or download.','<button class="secondary" onclick="refresh()">↻ Refresh</button><button class="primary" onclick="openStudioChat()">✦ Create in ChatGPT</button>')+cards(videos);
if(tab==='Calendar')return section('Publishing calendar','Upcoming Studio schedule records.')+'<div class="list glass">'+(videos.filter(v=>v.scheduled_for).sort((a,b)=>new Date(a.scheduled_for)-new Date(b.scheduled_for)).map(v=>'<div class="list-row"><div><b>'+esc(v.title)+'</b><p>'+new Date(v.scheduled_for).toLocaleString()+'</p></div><span class="tag">'+esc(v.status)+'</span></div>').join('')||'<div class="empty">No scheduled videos yet.</div>')+'</div>';
return section('Settings','Your accounts, publishing permissions and creative tools.')+'<div class="setting glass"><div><b>YouTube publishing</b><p>'+(studioConfig.youtube_connected?'Connected. Videos can be uploaded after approval.':studioConfig.youtube_oauth_configured?'Not connected yet. Authorize your channel to publish.':'Google OAuth credentials are not configured on Render yet.')+'</p></div><button class="primary" onclick="connectYouTube()" '+(!studioConfig.youtube_oauth_configured?'disabled':'')+'>'+(studioConfig.youtube_connected?'Reconnect':'Connect YouTube')+'</button></div><div class="setting glass"><div><b>AI scripting</b><p>'+(studioConfig.ai_writer_configured?'Optional server-side script generator configured. ChatGPT-driven videos do not require it.':'ChatGPT drives storyboard and narration through the private Studio plugin. No separate OpenAI API key is needed for that flow.')+'</p></div><span class="tag">'+(studioConfig.ai_writer_configured?'Ready':'Template mode')+'</span></div><div class="setting glass"><div><b>Storage</b><p>'+(studioConfig.asset_storage==='postgres_bytea'?'PostgreSQL-backed MP4 storage.':'Temporary preview storage; configure DATABASE_URL for persistence.')+'</p></div></div><div class="setting glass"><div><b>Your account</b><p>'+esc(me?.email)+'</p></div><button class="secondary" onclick="logout()">Sign out</button></div>'}
function formHtml(){let c=campaigns.find(c=>c.id===editing)||{},v=videos.find(v=>v.id===editing)||{};if(modal==='campaign')return '<form class="form" onsubmit="saveCampaign(event)"><label>Campaign name<input name="name" required value="'+esc(c.name||'')+'" placeholder="Thought leadership shorts"></label><label>Topic<input name="topic" value="'+esc(c.topic||'')+'" placeholder="New advances in biotech"></label><label>Audience<input name="audience" value="'+esc(c.audience||'')+'" placeholder="Biotech founders"></label><div class="row"><label>Style<select name="style"><option value="cutout" '+(c.style==='cutout'?'selected':'')+'>Cut-Out TV</option><option value="duotone" '+(c.style==='duotone'?'selected':'')+'>Paper Trail Duotone</option></select></label><label>Video length<select name="length">'+[15,30,45,60,90].map(n=>'<option value="'+n+'" '+((c.length||45)===n?'selected':'')+'>'+n+' seconds</option>').join('')+'</select></label></div><div class="row"><label>Preferred cadence<select name="frequency">'+['manual','daily','weekly','monthly'].map(n=>'<option value="'+n+'" '+(c.frequency===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>Publishing mode<select name="mode"><option value="review">Review first</option><option value="auto" '+(c.mode==='auto'?'selected':'')+'>Auto-publish approved ChatGPT videos</option></select></label></div><label>Channels<input name="channels" value="'+esc((c.channels||['youtube']).join(', '))+'" placeholder="youtube"></label><button class="primary">Save campaign →</button></form>'+(editing?'<button class="secondary" style="margin-top:12px;width:100%" onclick="runCampaign(\''+editing+'\')">Create campaign video in ChatGPT</button>':'')+'';
if(modal==='video')return '<form class="form" onsubmit="saveVideo(event)"><label>Video title<input name="title" required placeholder="Five ideas changing biotech"></label><label>Script<textarea name="script" placeholder="Write the storyline or voiceover..."></textarea></label><label>Campaign<select name="campaign_id"><option value="">Standalone video</option>'+campaigns.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></label><div class="row"><label>Style<select name="style"><option value="cutout">Cut-Out TV</option><option value="duotone">Paper Trail Duotone</option></select></label><label>Length<select name="length">'+[15,30,45,60,90].map(n=>'<option value="'+n+'" '+(n===45?'selected':'')+'>'+n+' seconds</option>').join('')+'</select></label></div><label>Channels<input name="channels" value="youtube"></label><button class="primary">Create and render MP4 →</button></form>';
if(modal==='postiz')return '<form class="form" onsubmit="savePostiz(event)"><label>Postiz URL<input required type="url" name="base_url" placeholder="https://your-postiz.example.com"></label><label>API key<input required type="password" name="api_key"></label><p>Keys are encrypted before storage. Never put secrets in GitHub.</p><button class="primary">Save connection →</button></form>';
if(modal==='detail')return '<div><div class="cover '+esc(v.style)+'" style="height:230px"><h4>'+esc(v.title)+'</h4></div><p>'+esc(v.script||'No script added.')+'</p><span class="tag">'+esc(v.status)+'</span><p>Duration: '+v.length+'s · '+esc(v.style)+'</p>'+(v.post_url?'<a href="'+esc(v.post_url)+'" target="_blank">Open published post ↗</a>':'')+'<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:18px">'+(['draft','failed'].includes(v.status)?'<button class="primary" onclick="renderVideo(\''+v.id+'\')">Render MP4</button>':'')+(['ready','approved','scheduled','published'].includes(v.status)?'<button class="secondary" onclick="previewVideo(\''+v.id+'\')">Preview / Download</button>':'')+(v.status==='ready'?'<button class="primary" onclick="approveVideo(\''+v.id+'\')">Approve video</button>':'')+(v.status==='approved'?'<button class="primary" onclick="publishVideo(\''+v.id+'\')">Publish on YouTube</button>':'')+'</div><div id="media-preview" style="padding-top:15px"></div>'+(v.status==='approved'?'<form class="form" onsubmit="saveSchedule(event)"><label>Publish on YouTube at a future date<input name="scheduled_for" type="datetime-local" required></label><button class="secondary" style="width:100%">Schedule on YouTube</button></form>':'')+'<p style="font-size:11px;color:#999">YouTube uploads require account authorization. Only explicitly approved videos or opt-in auto campaigns can publish.</p></div>';
return '';}
function render(){if(!token){$('#root').innerHTML='<div class="login glass"><div class="mark">✦</div><div class="eyebrow">WELCOME TO STUDIO</div><h1>Ideas, meet<br><span>their audience.</span></h1><p>Make remarkable B2B videos and keep everything beautifully in motion.</p><form onsubmit="login(event)" class="form"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="12"></label><button class="primary">'+(signup?'Create workspace':'Sign in')+' →</button></form><button class="link" onclick="signup=!signup;render()">'+(signup?'Already have an account? Sign in':'New here? Create an account')+'</button>'+(error?'<p class="error">'+esc(error)+'</p>':'')+'</div>';return;}
$('#root').innerHTML='<div class="shell"><aside class="side glass"><div class="brand"><span class="mark">✦</span>studio<b>.</b></div><div class="eyebrow" style="padding:10px 17px">WORKSPACE</div><nav class="menu">'+['Overview','Campaigns','Videos','Calendar','Settings'].map(t=>'<button class="'+(t===tab?'active':'')+'" onclick="nav(\''+t+'\')">'+t+'</button>').join('')+'</nav><div class="aside-note"><b>Good stories travel.</b><p>Make your next great idea impossible to scroll past.</p><button onclick="openModal(\'video\')">Create a video ↗</button></div></aside><main class="main"><div class="top"><div><div class="eyebrow">YOUR CREATIVE SPACE ✦</div><h1>'+(tab==='Overview'?'Make something great.':tab)+'</h1></div><button class="primary" onclick="openModal(\'video\')">＋ New video</button></div>'+content()+'</main></div>'+(modal?'<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal glass"><div class="modal-head"><div><span class="eyebrow">STUDIO / CREATE</span><h3>'+({video:'Create a video',campaign:'Campaign settings',detail:'Video details',postiz:'Connect Postiz'}[modal])+'</h3></div><button onclick="closeModal()">✕</button></div>'+formHtml()+(error?'<p class="error">'+esc(error)+'</p>':'')+'</div></div>':'');}
async function login(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{let r=await api('/auth/'+(signup?'register':'login'),'POST',d);token=r.token;localStorage.setItem('studioToken',token);error='';await refresh()}catch(e){error=e.message;render()}}
async function saveCampaign(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.length=+d.length;d.channels=d.channels.split(',').map(s=>s.trim()).filter(Boolean);d.active=true;try{await api('/campaigns'+(editing?'/'+editing:''),editing?'PUT':'POST',d);closeModal();await refresh()}catch(e){error=e.message;render()}}
async function saveVideo(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.length=+d.length;d.channels=d.channels.split(',').map(s=>s.trim()).filter(Boolean);if(!d.campaign_id)d.campaign_id=null;try{if(!d.script.trim()){let c=campaigns.find(x=>x.id===d.campaign_id)||{};let generated=await api('/studio/script','POST',{title:d.title,topic:c.topic||d.title,audience:c.audience||''});d.script=generated.script;}let v=await api('/videos','POST',d);await api('/videos/'+v.id+'/render','POST');closeModal();tab='Videos';await refresh()}catch(e){error=e.message;render()}}
async function saveSchedule(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{await api('/videos/'+editing+'/schedule','POST',{scheduled_for:new Date(d.scheduled_for).toISOString()});closeModal();await refresh()}catch(e){error=e.message;render()}}
async function savePostiz(e){e.preventDefault();try{await api('/settings/postiz','PUT',Object.fromEntries(new FormData(e.target)));closeModal();await refresh()}catch(e){error=e.message;render()}}

async function studioAction(path,method='POST',body){try{await api(path,method,body);error='';closeModal();await refresh()}catch(e){error=e.message;render()}}
async function renderVideo(id){await studioAction('/videos/'+id+'/render')}
async function approveVideo(id){await studioAction('/videos/'+id+'/approve')}
async function publishVideo(id){if(!confirm('Publish this approved MP4 publicly to the connected YouTube channel?'))return;await studioAction('/videos/'+id+'/publish','POST',{})}
async function runCampaign(id){openStudioChat()}
async function connectYouTube(){try{const r=await api('/youtube/connect');window.location.assign(r.authorization_url)}catch(e){error=e.message;render()}}
let previewBlobUrl=null;
async function previewVideo(id){try{
 const r=await fetch('/api/videos/'+encodeURIComponent(id)+'/media',{headers:{Authorization:'Bearer '+token}});
 if(!r.ok)throw Error('MP4 not ready or unavailable');
 if(previewBlobUrl)URL.revokeObjectURL(previewBlobUrl);
 previewBlobUrl=URL.createObjectURL(await r.blob());
 const target=document.getElementById('media-preview');
 if(target)target.innerHTML='<video controls autoplay playsinline style="width:min(280px,100%);border-radius:16px" src="'+previewBlobUrl+'"></video><p><a download="studio-'+esc(id)+'.mp4" href="'+previewBlobUrl+'">Download MP4</a></p>';
}catch(e){error=e.message;render()}}
function openStudioChat(){window.open('https://chatgpt.com/plugins/Plugin_00a7733291ac8191bdacb834c8dcb700','_blank','noopener')}
function logout(){localStorage.removeItem('studioToken');token='';render()}
render();if(token)refresh();
// Render jobs execute asynchronously. Refresh only when the user is viewing a
// nonmodal screen, so the draft dialog and MP4 playback are not interrupted.
setInterval(()=>{
  if(!token || modal) return;
  if(videos.some(v=>['queued','rendering','publishing','queued_for_upload'].includes(v.status))){
    refresh().catch(()=>{});
  }
},9000);
</script></body></html>
