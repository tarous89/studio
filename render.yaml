# Studio is already deployed as a separate Render service.
# This Blueprint is intended for attaching an isolated PostgreSQL connection
# and managing the SAME existing studio-web / studio-db resources.
databases:
  - name: studio-db
    databaseName: studio_db_6aek
    user: studio_db_6aek_user
    region: frankfurt
    plan: basic-256mb
services:
  - type: web
    name: studio-web
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studio-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://studio-web-hz4l.onrender.com
      - key: STUDIO_SMOKE_ONLY
        value: "0"
      - key: ENCRYPTION_KEY
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
