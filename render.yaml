databases:
  - name: studio-db
    databaseName: studio
    user: studio
    region: frankfurt
    plan: basic-256mb
services:
  - type: web
    name: studio-web
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studio-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: POSTIZ_URL
        sync: false
      - key: POSTIZ_API_KEY
        sync: false
